name: Build and Release

on:
  push:
    branches: [ "main", "v0.0.1" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Configure Git
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git reset --hard HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      - name: Install Frontend Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Reset Lockfile Changes
        run: |
          git checkout -- pnpm-lock.yaml || echo "No pnpm-lock changes"
          git checkout -- apps/desktop/src-tauri/Cargo.lock || echo "No Cargo.lock changes"

      - name: Build Workspace Packages
        run: pnpm --filter @morget/ipc-contract build

      - name: Run Tauri Build (Generate EXE)
        run: pnpm --filter morget-desktop tauri build

      # 🆕 方案 A：上傳便攜版裸 exe，繞過安裝包的 Dropper 啟發式攔截（推薦下載此版本）
      - name: Upload Portable EXE (Recommended)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: morget-portable-${{ github.ref_name }}
          path: apps/desktop/src-tauri/target/release/morget.exe
          retention-days: 30

      # 保留 NSIS 安裝包（僅供本地加白名單後測試使用）
      - name: Upload Installer Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: morget-installer-${{ github.ref_name }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
