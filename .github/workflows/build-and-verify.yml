name: Build and Release

on:
  push:
    branches: [ "v0.0.1" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Configure Git
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      # --- 🚀 緩存優化 1: pnpm 與 Node.js ---
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Node.js & Cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm' # ✅ 自動緩存 pnpm store，下次安裝秒級完成

      # --- 🚀 緩存優化 2: Rust & Cargo ---
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'
          cache-all-crates: true  # ✅ 緩存所有依賴
          cache-on-failure: true  # ✅ 即使編譯失敗也保留下載好的 Crate

      # --- 安裝依賴 (有緩存時極快) ---
      - name: Install Frontend Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Reset Lockfile Changes
        run: |
          git checkout -- pnpm-lock.yaml || echo "No pnpm-lock changes"
          git checkout -- apps/desktop/src-tauri/Cargo.lock || echo "No Cargo.lock changes"

      - name: Build Workspace Packages
        run: pnpm --filter @morget/ipc-contract build

      - name: Run Tauri Build (Generate EXE)
        run: pnpm --filter morget-desktop tauri build

      - name: Upload Portable EXE (Recommended)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: morget-portable-${{ github.ref_name }}
          path: apps/desktop/src-tauri/target/release/morget.exe
          retention-days: 30

      - name: Upload Installer Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: morget-installer-${{ github.ref_name }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
